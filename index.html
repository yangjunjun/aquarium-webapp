<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a2027"><title>一方水境 · Aquarium</title><link rel="stylesheet" href="src/style.css"></head>
<body><main><header><a class="brand" href="./"><span class="brand-icon">◌</span><span>一方水境<small>A LITTLE WORLD UNDERWATER</small></span></a><div class="live"><i></i> YOUR QUIET CORNER</div></header><section class="intro"><div><p class="eyebrow">THE LIVING AQUARIUM / 01</p><h1>把片刻，交给水下。</h1><p class="subtitle">看鱼群自在游弋，让生活慢下来一点。</p></div><button id="light" class="pill" aria-pressed="false">☼ 日光模式</button></section><section class="tank-shell" aria-label="模拟鱼缸"><div class="tank-top"><span><i></i> 森林溪流 · FRESHWATER</span><span id="mode-label">DAYLIGHT / 24°C</span></div><button id="fullscreen" class="fullscreen-toggle" aria-pressed="false" aria-label="全屏查看鱼缸">⛶ 全屏</button><canvas id="tank" tabindex="0" aria-label="动态鱼缸，点击或按回车投喂"></canvas><div class="tank-bottom"><span id="hint">点击水面，撒下一点鱼食</span><span>自然发生，静静观看 ↗</span></div><div class="paused" id="paused" hidden>水下时光已暂停</div></section><section class="dashboard"><div class="stat"><span class="label">水下居民</span><strong><span id="count">8</span><small> 尾</small></strong><span class="muted">三个品种，自在相伴</span></div><div class="stat"><span class="label">鱼群状态</span><strong id="activity">悠然游弋</strong><span class="muted" id="food-count">水草轻摇，气泡上升</span></div><div class="actions"><button id="feed" class="primary">✧ 投喂鱼群</button><button id="add">＋ 添加一尾</button><button id="pause" aria-pressed="false">Ⅱ 暂停</button><button id="clear" title="清理剩余鱼食">清理鱼食</button></div></section><footer><span>无需打理的微小生态 · 自动保存在此浏览器</span><button id="reset">重置鱼缸 ↺</button></footer><p id="notice" role="status" aria-live="polite"></p></main><script type="module" src="src/app.js"></script></body></html>
