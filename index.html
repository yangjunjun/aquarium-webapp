<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a2027"><title>一方水境 · Aquarium</title><link rel="stylesheet" href="src/style.css"></head>
<body data-theme="nature"><main>
<header><a class="brand" href="./"><span class="brand-icon">◌</span><span>一方水境<small>WORLDS BENEATH THE SURFACE</small></span></a><div class="live"><i></i> YOUR QUIET CORNER</div></header>
<section class="intro"><div><p class="eyebrow">THE LIVING AQUARIUM</p><h1>一方水境，三个世界。</h1><p class="subtitle" id="world-description">光穿过水草，生活慢慢发生。</p></div><button id="light" data-action="light" class="pill" aria-pressed="false">☼ 明亮</button></section>
<section class="theme-section" aria-labelledby="theme-heading"><div class="section-line"><h2 id="theme-heading">选择你的水下世界</h2><span>同一群伙伴，不同的奇遇</span></div><div id="theme-cards" class="theme-cards"></div></section>
<section class="tank-shell" aria-label="模拟鱼缸">
<div class="tank-top"><span><i></i><span id="world-badge">森林溪流 · FRESHWATER</span></span><span id="mode-label">明亮 / 自然溪流</span></div>
<div class="tank-toolbar"><label class="compact-theme" for="theme-select"><span class="sr-only">鱼缸主题</span><select id="theme-select" aria-label="鱼缸主题"></select></label><button class="immersive-control" data-action="light" aria-pressed="false">☼ 明亮</button><button class="immersive-control" data-action="motion" aria-pressed="false">减少动态</button><button class="immersive-control" data-action="pause" aria-pressed="false">Ⅱ 暂停</button><button id="fullscreen" aria-pressed="false" aria-label="全屏查看鱼缸">⛶ 全屏</button></div>
<canvas id="tank" tabindex="0" aria-label="动态鱼缸，点击或按回车投喂"></canvas>
<div class="tank-bottom"><span id="hint">点击水面，撒下一点鱼食</span><span id="tank-status">自然发生，静静观看</span></div>
<div class="paused" id="paused" hidden>水下时光已暂停</div>
</section>
<section class="dashboard"><div class="stat"><span class="label">水下居民</span><strong><span id="count">8</span><small> 尾鱼 · 2 只蟹</small></strong><span class="muted">切换世界，伙伴一直都在</span></div><div class="stat"><span class="label">生态状态</span><strong id="activity">悠然游弋</strong><span class="muted" id="food-count">水草轻摇，气泡上升</span></div><div class="actions"><button id="feed" class="primary">✧ 投喂鱼群</button><button id="add">＋ 添加一尾</button><button id="pause" data-action="pause" aria-pressed="false">Ⅱ 暂停</button><button id="clear">清理鱼食</button></div></section>
<footer><span id="save-status">世界与伙伴 · 自动保存在此浏览器</span><div class="footer-controls"><button id="motion" aria-pressed="false">减少动态：关</button><button id="reset">重置居民 ↺</button></div></footer><p id="notice" role="status" aria-live="polite"></p>
</main><script type="module" src="src/app.js"></script></body></html>
